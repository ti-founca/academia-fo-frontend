name: Deploy academia-fo-frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE: localhost/academia-fo-frontend

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: podman build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Conectar VPN WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo sed -i '/^DNS/d' /etc/wireguard/wg0.conf   # evita depender de resolvconf
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Enviar imagen al VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          podman save $IMAGE:latest | gzip | ssh $TARGET '
            podman tag localhost/academia-fo-frontend:latest localhost/academia-fo-frontend:previous 2>/dev/null || true
            gunzip | podman load'

      - name: Reiniciar servicio y verificar
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh $TARGET '
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            systemctl --user restart academia-fo-frontend
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:8086/ && echo "OK: respondiendo en 8086"
            podman image prune -f'

      - name: Desconectar VPN
        if: always()
        run: sudo wg-quick down wg0 || true