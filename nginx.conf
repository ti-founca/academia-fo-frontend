server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rutas de Angular (SPA): todo lo que no sea archivo → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS llevan hash en el nombre → caché larga
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes, fuentes, etc. (sin hash) → caché moderada
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html nunca en caché, para que los despliegues se vean al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}