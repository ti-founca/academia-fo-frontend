<div nz-row [nzGutter]="[8,8]">
    <div nz-col nzSpan="24">
        Estamentos sin evaluaciones
    </div>
    <div nz-col nzSpan="24">
        <nz-select
            nzMode="multiple"
            nzPlaceHolder="Seleccionar..."
            style="width: 100%;"
            [formControl]="estamentosCtrl"
            [nzLoading]="estamentoFacade.loading()"
            nzAllowClear>
            @for (estamento of estamentoFacade.estamentoList(); track estamento.id) {
                <nz-option [nzValue]="estamento.id" [nzLabel]="estamento.descripcion"></nz-option>
            }
        </nz-select>
    </div>
</div>
