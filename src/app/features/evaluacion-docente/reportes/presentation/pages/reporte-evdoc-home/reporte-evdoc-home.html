<div nz-row [nzGutter]="[8,8]">
    <div nz-col nzSpan="24">
        <div nz-row>
        <div nz-col nzFlex="auto">
            <button nz-button (click)="exportarReporte()">
                <nz-icon nzType="file-excel" nzTheme="outline" />
                Exportar
            </button>
        </div>
        <did nz-col nz-flex [nzGap]="12">
            <nz-select
                [formControl]="periodoLectivoCtrl"
                [nzLoading]="periodoLectivoFacade.loading()"
                (nzScrollToBottom)="periodoLectivoFacade.loadNextPage()"
                style="width: 300px"
                nzPlaceHolder="Periodo Lectivo..."
                nzAllowClear>
                @for (pl of periodoLectivoFacade.periodoLectivoList(); track pl.id) {
                    <nz-option [nzValue]="pl.id" [nzLabel]="pl.descripcion"></nz-option>
                }
            </nz-select>
            <nz-badge [nzCount]="cantidadFiltros()">
                <button nz-button nzType="default" (click)="abrirFiltros()">
                    <nz-icon nzType="filter" nzTheme="outline"></nz-icon>
                    Filtros
                </button>
            </nz-badge>
            <nz-segmented
                [nzOptions]="vistas"
                [(ngModel)]="vistaActiva">
            </nz-segmented>
            </did>
        </div>
  </div>
  <div nz-col nzSpan="24">
    @if (vistaActiva() == 'General') {
        <acadfo-evaluacion-general [idPeriodoLectivo]="idPeriodoLectivo()"></acadfo-evaluacion-general>
    }
    @else if (vistaActiva() == 'Por Indicador') {
        <acadfo-evaluacion-por-indicador></acadfo-evaluacion-por-indicador>
    }
  </div>
</div>
@if (panelFiltrosVisible()) {
<nz-drawer
  [nzClosable]="true"
  [nzVisible]="panelFiltrosVisible()"
  nzPlacement="right"
  nzTitle="Filtros"
  [nzContent]="filtrosTpl"
  (nzOnClose)="cerrarFiltros()">
</nz-drawer>
}

<ng-template #filtrosTpl>
    @if (vistaActiva() == 'General') {
        <acadfo-evdoc-form-filtro-general
            (cantidadFiltros)="setCantidadFiltros($event)">
        </acadfo-evdoc-form-filtro-general>
    }
    @if (vistaActiva() == 'Por Indicador') {
        <acadfo-evdoc-form-filtro-indicador></acadfo-evdoc-form-filtro-indicador>
    }
</ng-template>
