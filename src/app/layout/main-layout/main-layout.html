<nz-layout class="app-layout">
  <nz-sider
    class="menu-sidebar"
    nzCollapsible
    nzWidth="256px"
    nzBreakpoint="md"
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
  >
    <div class="sidebar-logo">
      <a href="https://ng.ant.design/" target="_blank">
        <img src="https://ng.ant.design/assets/img/logo.svg" alt="logo" />
        <h1>Academia FO</h1>
      </a>
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
      <li nz-submenu nzOpen nzTitle="Dashboard" nzIcon="dashboard">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/welcome">Welcome</a>
          </li>
        </ul>
      </li>
      <li nz-submenu nzOpen nzTitle="Eval. Docente" nzIcon="form">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/evaluacion-docente/reportes">Reportes</a>
          </li>
        </ul>
      </li>
    </ul>
  </nz-sider>
  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
          <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
        </span>
        <div class="user-menu" nz-dropdown nzTrigger="click" nzPlacement="bottomRight" [nzDropdownMenu]="userMenu">
          <nz-avatar nzIcon="user" nzSize="small" />
          <nz-icon nzType="down" />
        </div>
        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item nzDisabled class="user-info">
              <span class="user-info-nombre">{{ sesion.nombreCompleto() }}</span>
              <span class="user-info-correo">{{ sesion.usuario()?.correo }}</span>
            </li>
            <li nz-menu-divider></li>
            <li nz-menu-item (click)="cerrarSesion()">
              <nz-icon nzType="logout" />
              Cerrar sesión
            </li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </nz-header>
    <nz-content>
      <!--<div class="inner-content">-->
        <router-outlet></router-outlet>
      <!--</div>-->
    </nz-content>
  </nz-layout>
</nz-layout>
